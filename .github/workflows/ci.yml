name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/research-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest tests
      - name: Enforce critical research-method coverage
        run: >-
          uv run coverage report
          --include="src/worldstate/event_engine/*,src/worldstate/research_engine/history.py,src/worldstate/ai_researcher/claims.py,src/worldstate/ai_researcher/evidence.py,src/worldstate/macro_core/regimes.py,src/worldstate/market_core/sessions.py"
          --fail-under=90

  terminal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/terminal-ui/package-lock.json
      - run: npm ci --prefix apps/terminal-ui
      - run: npm run build --prefix apps/terminal-ui

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/terminal-ui/package-lock.json
            apps/desktop-tauri/package-lock.json
      - run: npm ci --prefix apps/terminal-ui
      - run: npm run build --prefix apps/terminal-ui
      - run: npm ci --prefix apps/desktop-tauri
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      - run: npm run build --prefix apps/desktop-tauri -- --no-bundle

  research-sidecar-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --directory services/research-api
      - name: Build and smoke frozen Research API
        shell: powershell
        run: ./scripts/build-research-sidecar.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: worldstate-research-api-windows
          path: apps/desktop-tauri/src-tauri/bin/worldstate-research-api
          if-no-files-found: error
