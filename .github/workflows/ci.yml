name: CI

on:
  push:
    branches: [main, refactor/macro-research-terminal]
  pull_request:

jobs:
  research-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/research-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest tests

  terminal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/terminal-ui/package-lock.json
      - run: npm ci --prefix apps/terminal-ui
      - run: npm run build --prefix apps/terminal-ui

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/terminal-ui/package-lock.json
            apps/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix apps/terminal-ui
      - run: npm ci --prefix apps/desktop-tauri
      - run: npm run check --prefix apps/desktop-tauri
