name: Macro Engine

on:
  pull_request:
    paths:
      - ".github/workflows/macro-engine.yml"
      - "data/macro/**"
      - "services/macro-engine/**"
      - "docker-compose.macro.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/macro-engine.yml"
      - "data/macro/**"
      - "services/macro-engine/**"
      - "docker-compose.macro.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/macro-engine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: macro
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macro -d macro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MACRO_DATABASE_URL: postgresql+asyncpg://macro:macro-ci@127.0.0.1:5432/macro
      MACRO_CATALOG_ROOT: ${{ github.workspace }}/data/macro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.31
      - name: Install locked dependencies
        run: python -m uv sync --locked --group dev
      - name: Lint
        run: python -m uv run ruff check .
      - name: Type check
        run: python -m uv run mypy src tests
      - name: Test
        run: python -m uv run pytest
      - name: Apply migrations
        run: python -m uv run alembic upgrade head
      - name: Validate catalog
        run: python -m uv run macro-engine catalog validate
      - name: Build container
        working-directory: ${{ github.workspace }}
        run: docker build -f services/macro-engine/Dockerfile -t world-state-macro-engine:test .
