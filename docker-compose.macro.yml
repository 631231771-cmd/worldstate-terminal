services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: macro
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: "${MACRO_POSTGRES_PASSWORD:-macro-local-only}"
    volumes:
      - macro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  macro-engine:
    build:
      context: .
      dockerfile: services/macro-engine/Dockerfile
    image: world-state-macro-engine:local
    environment:
      MACRO_DATABASE_URL: "postgresql+asyncpg://macro:${MACRO_POSTGRES_PASSWORD:-macro-local-only}@postgres:5432/macro"
      MACRO_ENGINE_URL: "http://macro-engine:8000"
      MACRO_CATALOG_ROOT: "/app/data/macro"
      MACRO_DEFAULT_LOCALE: "${MACRO_DEFAULT_LOCALE:-zh-CN}"
      MACRO_DEFAULT_TIMEZONE: "${MACRO_DEFAULT_TIMEZONE:-Asia/Taipei}"
      MACRO_STRICT_POINT_IN_TIME: "${MACRO_STRICT_POINT_IN_TIME:-true}"
      MACRO_ENABLE_WRITES: "${MACRO_ENABLE_WRITES:-false}"
      MACRO_WRITE_TOKEN: "${MACRO_WRITE_TOKEN:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      DBNOMICS_BASE_URL: "${DBNOMICS_BASE_URL:-https://api.db.nomics.world/v22}"
    command: >
      sh -c "uv run --no-sync macro-engine migrate &&
      uv run --no-sync macro-engine catalog validate &&
      uv run --no-sync macro-engine serve --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${MACRO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-state-terminal-web:local
    environment:
      LOCAL_API_MODE: docker
      LOCAL_API_CLOUD_FALLBACK: "false"
      LOCAL_API_PORT: "46123"
      MACRO_ENGINE_URL: "http://macro-engine:8000"
    ports:
      - "${WM_PORT:-3000}:8080"
    depends_on:
      macro-engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  macro-postgres-data:

