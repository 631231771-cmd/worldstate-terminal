[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "worldstate-research-api"
version = "0.5.0"
description = "Evidence-bounded macro release and cross-asset research service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "World State Terminal contributors" }]
dependencies = [
  "aiosqlite>=0.20,<0.21",
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "polars>=1.18,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
analytics = ["macrosynergy>=1.8,<2"]
openbb = ["openbb==4.7.2"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
  "types-defusedxml>=0.7,<1",
]

[project.scripts]
worldstate-research = "worldstate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldstate"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PT", "RUF", "S", "SIM", "UP", "W"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "N999", "PERF401", "S608"]
"src/worldstate/ai_researcher/evidence.py" = ["PERF401"]
"src/worldstate/event_engine/explanation.py" = ["PERF401"]
"src/worldstate/event_engine/fixtures.py" = ["S311"]
"src/worldstate/provider_kit/fixtures.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=worldstate --cov-report=term-missing --cov-fail-under=65"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["worldstate"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '\.\.\.',
]
